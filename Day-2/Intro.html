<!-- Declares the document type and version of HTML -->
 <!-- helps the browser understand how to render the content correctly -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- Specifies the character encoding for the HTML -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- This tag helps control how the page appears on mobile devices, making it responsive. -->
    <title>Intro to HTML and CSS</title>
    <!-- link the stylesheet (css files) -->
    <link rel="stylesheet" href="Intro.css">
    <!-- link the fontawsome style for icons etc. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<!-- used to define the html body structure -->
<body>
    <div class="box">
    </div>
    <h1>This is the <span id="r">Red</span> <span id="b">Blue</span> <span id="g">Green</span></h1>
    <div class="icon">
        <a href="https://www.amazon.in" target="_blank"><i class="fa fa-amazon fa-2x"></i></a>
        <a href="https://www.google.com/" target="_blank"><i class="fa fa-google fa-2x"></i></a>
        <a href="https://www.linkedin.com" target="_blank"><i class="fa fa-linkedin fa-2x"></i></a>
    </div>

</body>
</html>
